# Cấu hình deploy Next.js trên Netlify.
# Giá trị ở đây ghi đè mục "Build settings" trong giao diện Netlify (nhất là Publish directory cũ là "public").

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 cần Node >= 20.9
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Biến môi trường cần đặt trong giao diện Netlify (Site configuration → Environment variables), không ghi vào file này:
#   ZALO_BE_URL  = https://api-v3.metus.vn
#   INTERNAL_KEY = <khóa nội bộ của backend VPS>
